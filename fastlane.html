<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Registra tu visita — Vecinoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#252d29; --muted:#68726b; --brand:#344f40; --canvas:#f7f8f4; --line:#dce2da; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; }
  main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  .sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  .box { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:16px; display:grid; gap:10px; }
  .box .h { font-size:11px; font-weight:600; text-transform:uppercase; color:var(--muted); }
  .lbl { font-size:12px; color:var(--muted); }
  .val { font-size:14px; font-weight:600; }
  label.f { display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
  input[type=text] { width:100%; height:44px; border:1px solid var(--line); border-radius:10px; padding:0 12px; font:inherit; font-size:16px; margin-bottom:16px; }
  input[type=file] { display:none; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { height:44px; border-radius:10px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .outline { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .primary { width:100%; margin-top:16px; background:var(--brand); border:0; color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .fname { margin:6px 0 0; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .err { color:var(--err); font-size:14px; margin:12px 0 0; }
  .qr { display:flex; justify-content:center; padding:16px; margin-bottom:16px; }
  .qr svg { width:220px; height:220px; }
  .center { text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main><div class="card" id="root"><p class="center">…</p></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  // FastLane self-registration for visitors. Lives on vecinoo.app so the link
  // never exposes the admin domain. Talks straight to the public
  // fastlane-submit Edge Function (verify_jwt = false, CORS open); the access
  // code in the link is the only credential.
  var FUNCTION_URL = 'https://oirzzluyrffxsnlbtznr.supabase.co/functions/v1/fastlane-submit';
  var T = {
    title: 'Registra tu visita', desc: 'Llena tus datos para que la portería te deje pasar.',
    name: 'Nombre completo', plate: 'Placa del vehículo (opcional)', photo: 'Foto de tu identificación',
    submit: 'Enviar', invalid: 'Link inválido', missing: 'A este link le falta el código de acceso.',
    host: 'Tu anfitrión', take: 'Tomar foto', upload: 'Subir foto', resident: 'Residente',
    location: 'Ubicación', visitor: 'Visitante', plateShort: 'Placa', valid: 'Válido',
    expired: 'Este FastLane ha expirado.', created: 'Tu FastLane ha sido creado',
    createdDesc: 'Muestra este código QR a seguridad en la entrada.',
    generic: 'Algo salió mal. Intenta de nuevo.'
  };
  var root = document.getElementById('root');
  var m = location.hash.match(/^#fastlane\/(.+)$/);
  var code = m ? decodeURIComponent(m[1]) : null;
  var info = null, photo = null;

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function row(label, value) { return value ? '<div><div class="lbl">' + esc(label) + '</div><div class="val">' + esc(value) + '</div></div>' : ''; }
  function message(title, desc) { root.innerHTML = '<h1>' + esc(title) + '</h1><p class="sub" style="margin:0">' + esc(desc) + '</p>'; }
  function windowText(i) {
    var f = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    return f.format(new Date(i.valid_from)) + ' – ' + f.format(new Date(i.valid_until));
  }

  function renderRegistered() {
    // The QR is this same link, in its public vecinoo.app form.
    var qr = qrcode(0, 'M');
    qr.addData(location.origin + '/#fastlane/' + encodeURIComponent(code));
    qr.make();
    root.innerHTML =
      '<h1>' + T.created + '</h1><p class="sub">' + T.createdDesc + '</p>' +
      '<div class="qr">' + qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }) + '</div>' +
      '<div class="box" style="border:0;padding:0">' +
        row(T.visitor, info.visitor_name) + row(T.plateShort, info.plate) +
        row(T.resident, info.resident_name) + row(T.location, info.location_path) +
        row(T.valid, windowText(info)) + '</div>' +
      (info.expired ? '<p class="err">' + T.expired + '</p>' : '');
  }

  function renderForm() {
    var needsName = !(info.visitor_name || '').trim();
    root.innerHTML =
      '<h1>' + T.title + '</h1><p class="sub">' + T.desc + '</p>' +
      '<div class="box"><div class="h">' + T.host + '</div>' +
        row(T.resident, info.resident_name) + row(T.location, info.location_path) + row(T.visitor, info.visitor_name) + '</div>' +
      (needsName ? '<label class="f" for="name">' + T.name + '</label><input type="text" id="name" autocomplete="name">' : '') +
      '<label class="f" for="plate">' + T.plate + '</label><input type="text" id="plate" autocapitalize="characters">' +
      '<label class="f">' + T.photo + '</label>' +
      '<input type="file" id="cam" accept="image/*" capture="environment"><input type="file" id="up" accept="image/*">' +
      '<div class="row"><button type="button" class="outline" id="takeBtn">' + T.take + '</button>' +
      '<button type="button" class="outline" id="upBtn">' + T.upload + '</button></div>' +
      '<p class="fname" id="fname"></p><p class="err" id="err" hidden></p>' +
      '<button type="button" class="primary" id="send" disabled>' + T.submit + '</button>';

    var nameEl = document.getElementById('name'), plateEl = document.getElementById('plate');
    var send = document.getElementById('send'), errEl = document.getElementById('err');
    function validate() { send.disabled = !photo || (needsName && !nameEl.value.trim()); }
    function pick(e) { photo = e.target.files[0] || null; document.getElementById('fname').textContent = photo ? photo.name : ''; validate(); }
    document.getElementById('cam').onchange = pick;
    document.getElementById('up').onchange = pick;
    document.getElementById('takeBtn').onclick = function () { document.getElementById('cam').click(); };
    document.getElementById('upBtn').onclick = function () { document.getElementById('up').click(); };
    if (nameEl) nameEl.oninput = validate;

    send.onclick = function () {
      send.disabled = true; errEl.hidden = true;
      var fd = new FormData();
      fd.set('code', code);
      fd.set('name', needsName ? nameEl.value.trim() : '');
      fd.set('plate', plateEl.value.trim());
      fd.set('photo', photo);
      fetch(FUNCTION_URL, { method: 'POST', body: fd })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) {
          if (!res.ok || !res.b.success) throw new Error(res.b.error || T.generic);
          info.registered = true;
          info.visitor_name = info.visitor_name || (nameEl ? nameEl.value.trim() : '');
          info.plate = plateEl.value.trim() || info.plate;
          renderRegistered();
        })
        .catch(function (e) { errEl.textContent = e.message || T.generic; errEl.hidden = false; validate(); });
    };
  }

  if (!code) {
    message(T.invalid, T.missing);
  } else {
    fetch(FUNCTION_URL + '?code=' + encodeURIComponent(code))
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) return message(T.invalid, res.b.error || T.generic);
        info = res.b;
        if (info.registered) renderRegistered();
        else if (info.expired) message(T.invalid, T.expired);
        else renderForm();
      })
      .catch(function () { message(T.invalid, T.generic); });
  }
</script>
</body>
</html>
